# Paste into a new automation:
# Settings > Automations & scenes > Create automation > ⋮ > Edit in YAML
#
# Refreshes every 10 minutes, 07:00 to 08:30 on weekdays (9 API calls a day).
# Adjust to fit your TransportAPI plan's daily limit.

alias: Update bus times
description: Refresh bus data on weekday mornings only
mode: single
triggers:
  - trigger: time_pattern
    minutes: "/10"
conditions:
  - condition: time
    after: "07:00:00"
    before: "08:30:00"
    weekday: [mon, tue, wed, thu, fri]
actions:
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.next_bus_to_city
